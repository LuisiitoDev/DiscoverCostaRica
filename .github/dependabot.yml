version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      aspire:
        patterns: ["Aspire.*"]
      efcore:
        patterns: ["Microsoft.EntityFrameworkCore*"]
      aspnetcore:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.Extensions.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "Testcontainers*", "NetArchTest*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
